<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="images/tempLogo.png" />

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />

    <!-- jQuery UI CSS -->
    <link
      rel="stylesheet"
      href="https://code.jquery.com/ui/1.13.2/themes/base/jquery-ui.css"
    />

    <link rel="stylesheet" href="../style.css" />
    <link rel="stylesheet" href="../video.css" />
    <link rel="stylesheet" href="../index.css" />
    <title>VibeLink</title>
  </head>

  <body>
    <header>
      <nav>
        <section id="logo-container">
          <a href="../index.html"
            ><section id="logo" class="adjustForImage"></section
          ></a>
          <form action="https://www.google.com/search" method="get">
            <input
              id="searchBar"
              name="q"
              placeholder="Search VibeLink"
              type="search"
            />
          </form>
        </section>

        <ul id="nav-ul">
          <li>
            <a href="../index.html" class="nav-before"
              ><img src="../Images/nav-item-home.svg" alt="" class="nav-items"
            /></a>
          </li>
          <li>
            <a href="../friend.html" class="nav-before"
              ><img
                src="../Images/nav-item-friend.svg"
                alt=""
                class="nav-items"
            /></a>
          </li>
          <li>
            <a href="../video.html" class="nav-before"
              ><img
                src="../Images/nav-item-video.svg"
                alt=""
                class="focus nav-items"
            /></a>
          </li>
          <li>
            <a href="../Mart.html" class="nav-before"
              ><img
                src="../Images/nav-item-market.svg"
                alt=""
                class="nav-items"
            /></a>
          </li>
          <li>
            <a href="../group.html" class="nav-before"
              ><img src="../Images/nav-item-group.svg" alt="" class="nav-items"
            /></a>
          </li>
        </ul>

        <div id="nav-right-container">
          <section class="nav-right" id="Menu">
            <img src="../Images/nav-right-menu.svg" alt="" />
          </section>
          <section class="nav-right" id="Messenger">
            <div id="messenger-container">
              <div>
                <h3>Chats</h3>
              </div>
              <div>
                <input
                  type="search"
                  placeholder="Search Your Friends"
                  id="searchBar"
                  style="width: 22vw"
                />
              </div>
              <div id="chat-filter-buttons">
                <button style="color: #0064da; background-color: #ebf5ff">
                  Inbox
                </button>
                <button>Communities</button>
              </div>
              <div
                class="contact-container"
                style="overflow-y: scroll; height: 23vw"
              >
                <div style="display: none">
                  <section class="friend-template d-flex gap-2 aic">
                    <div class="box-right-icon adjustForImage">
                      <span
                        class="position-absolute top-0 start-100 translate-middle p-1 border border-light border-2 bg-success rounded-circle"
                      >
                        <span class="visually-hidden">New alerts</span>
                      </span>
                    </div>
                    <h6 class="contact-name"></h6>
                  </section>
                </div>
              </div>
            </div>
          </section>
          <section class="nav-right" id="Notification">
            <div id="notification-container">
              <div id="not-top">
                <h3>Notification</h3>
                <section id="not-more"></section>
              </div>
              <div id="not-button-container">
                <button>All</button>
                <button>Unread</button>
              </div>
              <div class="d-flex aic not-container">
                <section class="not-image-container"></section>
                <h6>Dummy-text</h6>
              </div>
              <div class="d-flex aic not-container">
                <section class="not-image-container"></section>
                <h6>Dummy-text</h6>
              </div>
              <div class="d-flex aic not-container">
                <section class="not-image-container"></section>
                <h6>Dummy-text</h6>
              </div>
            </div>
          </section>
          <section class="nav-right profile-image adjustForImage" id="Account">
            <div id="account-container">
              <section id="profile-info">
                <section id="profile-info-inner">
                  <section
                    class="nav-right profile-image adjustForImage"
                    style="width: 3vw; height: 3vw"
                  ></section>
                  <h4>Chetan Timsina</h4>
                </section>
                <div class="hrLine"></div>
                <section id="switchuser-container" class="d-flex jcc aic">
                  <img id="switchuser" src="../Images/switchUser.svg" alt="" />
                  <h6>See all Profiles</h6>
                </section>
              </section>
              <section id="setting-container" class="d-flex">
                <div>
                  <section
                    id="icon-1"
                    class="icon-container adjustForImage"
                  ></section>
                  <h6>Setting & Privacy</h6>
                </div>
                <div>
                  <section
                    id="icon-2"
                    class="icon-container adjustForImage"
                  ></section>
                  <h6>Help & Support</h6>
                </div>
                <div>
                  <section
                    id="icon-3"
                    class="icon-container adjustForImage"
                  ></section>
                  <h6>Display & Accelebility</h6>
                </div>
                <div>
                  <section
                    id="icon-4"
                    class="icon-container adjustForImage"
                  ></section>
                  <h6>Give Feedback</h6>
                </div>
                <div>
                  <section
                    id="icon-5"
                    class="icon-container adjustForImage"
                  ></section>
                  <h6>Log Out</h6>
                </div>
              </section>
            </div>
          </section>
        </div>
      </nav>
    </header>
    <main id="main-container" class="d-flex bg-white">
      <div class="box-left">
        <div class="box-left-top d-flex justify-content-between aic">
          <h3><b>Reels</b></h3>
          <section class="left-icon-container" id="left-video-0"></section>
        </div>
        <div id="selectable">
          <section class="ui-widget-content">
            <section class="left-icon-container" id="left-video-1"></section>
            <a href="../video.html">
              <h6>Video</h6>
            </a>
          </section>
          <section class="ui-widget-content">
            <section class="left-icon-container" id="left-video-2"></section>
            <a href="live.html">
              <h6>Live</h6>
            </a>
          </section>
          <section class="ui-widget-content">
            <section class="left-icon-container" id="left-video-3"></section>
            <a href="reels.html">
              <h6>Reels</h6>
            </a>
          </section>
          <section class="ui-widget-content">
            <section class="left-icon-container" id="left-video-4"></section>
            <a href="shows.html">
              <h6>Shows</h6>
            </a>
          </section>
          <section class="ui-widget-content">
            <section class="left-icon-container" id="left-video-5"></section>
            <a href="explore.html">
              <h6>Explore</h6>
            </a>
          </section>
          <section class="ui-widget-content">
            <section class="left-icon-container" id="left-video-6"></section>
            <a href="save.html">
              <h6>Save Videos</h6>
            </a>
          </section>
        </div>
      </div>

      <div id="box-main" class="box-main-4 d-flex flex-column aic p-5">
        <!-- Video Cards will appear here -->
      </div>
    </main>
    <!-- jQuery & jQuery UI-->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://code.jquery.com/ui/1.13.2/jquery-ui.min.js"></script>

    <!-- Bootstrap JS -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>

    <!-- Main Script -->
    <script src="../script.js"></script>
    <script src="../video.js"></script>
    <script src="../index.js"></script>
  </body>
</html>
